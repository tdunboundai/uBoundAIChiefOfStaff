[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uboundai-gtm"
version = "0.1.0"
description = "UnboundAI GTM bots: Prospecting, Audit-Generation, Outreach, Competitive Monitoring, and GEO Content"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
uboundai-gtm = "uboundai_gtm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["uboundai_gtm*"]
